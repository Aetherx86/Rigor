name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo test --workspace --release
      - run: cargo build --release -p rigor-bench
      - name: Browser build compiles
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path web/Cargo.toml
