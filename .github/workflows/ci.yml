name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Release test suite
        run: cargo test --workspace --release
      - name: Release CLI binary
        run: cargo build --release -p rigor-bench
      - name: Browser WASM build compiles
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path web/Cargo.toml
