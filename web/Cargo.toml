[package]
name = "rigor-web"
version = "0.2.0"
edition = "2021"
publish = false
description = "Browser build of the Rigor kernel and lean4export parser (sequential checking)."

[lib]
crate-type = ["cdylib"]

[dependencies]
rigor-parser = { path = "../crates/parser" }
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
